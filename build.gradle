plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

ext.operatorBackendFiles = ['operator_stdio.py', 'simple_phone_backend.py', 'call_signalling.py',
        'callback_requests.py', 'organization_lines.py', 'private_calls.py', 'secure_relay.py',
        'voicemail.py', 'requirements.txt']
sourceSets.main.java.srcDir('operator-protocol/src/main/java')

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}-fabric"
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "MaxHenkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
    mavenCentral()
}

dependencies {
    implementation "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"


    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Original code imports both the public API and internal Simple Voice Chat
    // classes. The full Modrinth mod jar is compile-only here. Keep it out of
    // Loom remapping because current SVC jars may be built with newer Loom.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    compileOnly "maven.modrinth:simple-voice-chat:${project.voicechat_mod_version}"
}

processResources {
    if (!providers.gradleProperty('foxClientOnly').isPresent() && file('backend/operator_stdio.py').isFile()) {
        from(layout.buildDirectory.dir('operator-runtimes')) {
            include '*.zip'
            into 'fox-operator/runtime'
        }
        from('backend') {
            include operatorBackendFiles
            into 'fox-operator'
        }
    }
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minimum_loader_version", project.minimum_loader_version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "minimum_loader_version": project.minimum_loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    if (providers.gradleProperty('foxClientOnly').isPresent()) archiveClassifier.set('client')
    from("NOTICE.md")
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

