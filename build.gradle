plugins {
    id "fabric-loom" version "1.13.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "MaxHenkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
    mavenCentral()
}

dependencies {
    implementation "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Development uses Yarn/named mappings. The copied source still contains
    // many intermediary names, so the first project task is remapping/cleanup.
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Original code imports both the public API and internal Simple Voice Chat
    // classes. The full Modrinth mod jar is compile-only here. Keep it out of
    // Loom remapping because current SVC jars may be built with newer Loom.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    compileOnly "maven.modrinth:simple-voice-chat:${project.voicechat_mod_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minimum_loader_version", project.minimum_loader_version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "minimum_loader_version": project.minimum_loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

jar {
    from("NOTICE.md")
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

